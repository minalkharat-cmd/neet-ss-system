<style>
  :root{
    --bg:#05060a; --surface:#0a1020; --surface-2:#0f1830; --surface-3:#16224a;
    --ink:#dceaff; --ink-2:#8fa6d8; --ink-3:#56688f;
    --line:#1b2c52; --line-glow:#2a4a8c;
    --accent:#38bdf8; --accent-ink:#7dd3fc; --accent-soft:#0c1f3a;
    --glow:#22d3ee; --glow-strong:#5eead4;
    --good:#34d399; --good-soft:#08231b; --bad:#fb7185; --bad-soft:#2a0d16;
    --warn:#fbbf24; --warn-soft:#2a1e06; --gold:#fcd34d; --gold-soft:#2a2106;
    --rank-E:#8a93a6; --rank-D:#34d399; --rank-C:#38bdf8; --rank-B:#a78bfa;
    --rank-A:#fb923c; --rank-S:#f87171; --rank-N:#fcd34d;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --r:14px; --r-sm:10px;
    --glow-sm:0 0 0 1px var(--line-glow),0 0 14px rgba(56,189,248,.10);
    --glow-md:0 0 0 1px var(--accent),0 0 22px rgba(56,189,248,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
    -webkit-text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:none;
    background:
      radial-gradient(120% 80% at 50% -10%,rgba(56,189,248,.10),transparent 60%),
      radial-gradient(90% 60% at 50% 120%,rgba(34,211,238,.06),transparent 60%),
      var(--bg);
    background-attachment:fixed;}
  h1,h2,h3{margin:0;text-wrap:balance}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  .tnum{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono)}

  /* App shell */
  #app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px 120px;min-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px;position:sticky;top:0;z-index:5}
  .wordmark{font-weight:800;font-size:18px;letter-spacing:1.5px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
  .wordmark .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--glow));
    display:grid;place-items:center;color:#03101f;font-family:var(--mono);font-weight:800;font-size:13px;
    box-shadow:0 0 16px rgba(56,189,248,.5)}
  .wordmark small{display:block;font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:2px;
    text-transform:uppercase;color:var(--accent-ink)}
  .icon-btn{width:40px;height:40px;border-radius:10px;background:var(--surface);box-shadow:var(--glow-sm);
    display:grid;place-items:center;font-size:17px;color:var(--accent-ink)}

  /* System panels */
  .card,.win{background:linear-gradient(180deg,var(--surface),#080d1a);border-radius:var(--r);
    padding:16px;margin-bottom:14px;position:relative;
    border:1px solid var(--line);box-shadow:var(--glow-sm)}
  .win{border-color:var(--line-glow)}
  .win::before,.win::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
  .win::before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
  .win::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}
  .card.tight{padding:13px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
  .muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
  .glow{color:var(--accent);text-shadow:0 0 10px rgba(56,189,248,.6)}
  .gold{color:var(--gold);text-shadow:0 0 10px rgba(252,211,77,.5)}

  /* Section header = system label */
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
  .sec-h h2{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--accent-ink)}
  .sec-h h2::before{content:"[ ";color:var(--ink-3)} .sec-h h2::after{content:" ]";color:var(--ink-3)}
  .sec-h a{font-size:12px;color:var(--accent);font-weight:600;font-family:var(--mono)}

  /* Buttons — cut-corner system style */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;
    font-weight:700;font-size:14.5px;letter-spacing:.3px;background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line-glow);width:100%;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--glow));color:#03101f;border-color:transparent;
    box-shadow:0 0 20px rgba(56,189,248,.35)}
  .btn.ghost{background:transparent;border-color:var(--line)}
  .btn.sm{padding:9px 13px;font-size:12.5px;width:auto}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.4}
  .btn-row{display:flex;gap:10px}

  /* Chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.3px;
    background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-2);font-family:var(--mono)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px rgba(56,189,248,.25)}

  /* Stat tiles */
  .grid{display:grid;gap:12px} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr}
  .stat{background:var(--surface);border-radius:var(--r-sm);padding:14px;border:1px solid var(--line);box-shadow:var(--glow-sm)}
  .stat .n{font-family:var(--mono);font-size:28px;line-height:1;font-weight:700;color:var(--accent)}
  .stat .n small{font-size:13px;color:var(--ink-3);font-weight:600}
  .stat .l{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:7px}

  /* Progress / XP bar */
  .bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--glow-strong));border-radius:99px;
    box-shadow:0 0 10px rgba(56,189,248,.6);transition:width .6s ease}
  .bar.good>i{background:linear-gradient(90deg,var(--good),#6ee7b7);box-shadow:0 0 10px rgba(52,211,153,.5)}
  .bar.warn>i{background:linear-gradient(90deg,var(--warn),#fde68a)} .bar.bad>i{background:linear-gradient(90deg,var(--bad),#fda4af)}

  /* Bottom nav */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,13,26,.92);
    backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-top:1px solid var(--line-glow);padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
    display:flex;justify-content:space-around;max-width:640px;margin:0 auto;
    box-shadow:0 -8px 24px rgba(0,0,0,.5)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;
    color:var(--ink-3);font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:1px;border-radius:10px}
  .tab svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--accent);text-shadow:0 0 10px rgba(56,189,248,.5)}
  .tab .badge{position:absolute;transform:translate(13px,-6px);background:var(--bad);color:#1a0508;
    font-size:9.5px;font-weight:800;min-width:15px;height:15px;border-radius:99px;display:grid;place-items:center;padding:0 3px}

  /* Lists */
  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none} .row .grow{flex:1;min-width:0}
  .pill{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:99px;
    background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
  .pill.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
  .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
  .pill.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

  /* Rank badge */
  .rank{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:1px;padding:4px 10px;border-radius:6px;
    border:1px solid currentColor;display:inline-grid;place-items:center}
  .r-E{color:var(--rank-E)} .r-D{color:var(--rank-D)} .r-C{color:var(--rank-C)} .r-B{color:var(--rank-B)}
  .r-A{color:var(--rank-A)} .r-S{color:var(--rank-S);text-shadow:0 0 8px rgba(248,113,113,.6)} .r-N{color:var(--rank-N);text-shadow:0 0 10px rgba(252,211,77,.6)}

  /* Form */
  label.f{display:block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);margin:12px 0 5px;letter-spacing:.8px;text-transform:uppercase}
  .inp{width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 12px rgba(56,189,248,.3)}
  textarea.inp{min-height:64px;resize:vertical;line-height:1.4}

  /* Quest checklist */
  .chk{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .chk:last-child{border-bottom:none}
  .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-glow);display:grid;place-items:center;flex:none;color:transparent;font-size:13px}
  .chk.on .box{background:var(--accent);border-color:var(--accent);color:#03101f;box-shadow:0 0 12px rgba(56,189,248,.5)}
  .chk.on .lbl{color:var(--ink-3);text-decoration:line-through}

  /* Overlay */
  .overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .overlay.open{display:flex}
  .ov-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .timer{font-family:var(--mono);font-weight:700;font-size:17px;padding:5px 12px;border-radius:99px;
    background:var(--surface-2);border:1px solid var(--line-glow);color:var(--accent-ink)}
  .timer.low{color:var(--bad);background:var(--bad-soft);border-color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}

  /* Question option */
  .opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--surface);margin-bottom:10px;width:100%;text-align:left}
  .opt .k{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;
    font-family:var(--mono);font-weight:700;font-size:13px;flex:none;color:var(--ink-2)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 14px rgba(56,189,248,.25)}
  .opt.sel .k{background:var(--accent);color:#03101f}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#042}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#2a0508}

  .palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .pnum{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;
    background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-2)}
  .pnum.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .pnum.mark{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .pnum.cur{outline:2px solid var(--accent);outline-offset:1px}

  /* Flashcard = shadow extraction core */
  .fc{min-height:230px;border-radius:18px;background:radial-gradient(120% 80% at 50% 0%,var(--surface-3),var(--surface));
    border:1px solid var(--line-glow);display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:28px 22px;gap:14px;box-shadow:0 0 24px rgba(56,189,248,.15)}
  .fc .side{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .fc .q{font-family:var(--serif);font-size:22px;line-height:1.3;font-weight:600}
  .fc .a{font-size:17px;line-height:1.4;color:var(--ink);max-width:34ch}

  .grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grade button{padding:12px 4px;border-radius:11px;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:2px;
    border:1.5px solid var(--line-glow);background:var(--surface);font-family:var(--mono)}
  .grade button small{font-size:9.5px;font-weight:600;color:var(--ink-3)}
  .grade .again{color:var(--bad)} .grade .hard{color:var(--warn)} .grade .good{color:var(--glow-strong)} .grade .easy{color:var(--good)}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
  .empty .big{font-size:34px;margin-bottom:8px} .center{text-align:center}
  .hr{height:1px;background:var(--line-glow);margin:14px 0}

  /* Flash toast */
  .flash{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
    background:var(--surface-2);color:var(--accent);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;
    font-family:var(--mono);border:1px solid var(--accent);box-shadow:var(--glow-md);
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .flash.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  /* System notification banner */
  #sysnotify{position:fixed;top:0;left:0;right:0;z-index:70;max-width:640px;margin:0 auto;
    background:linear-gradient(180deg,rgba(8,18,40,.98),rgba(8,13,26,.95));border-bottom:1px solid var(--accent);
    box-shadow:0 0 30px rgba(56,189,248,.4);padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;
    transform:translateY(-120%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1);display:none}
  #sysnotify.show{transform:translateY(0);display:block}
  .sys-tag{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--accent);font-weight:700;text-transform:uppercase}
  .sys-title{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink);margin:4px 0 6px;letter-spacing:.5px}
  .sys-line{font-size:13.5px;color:var(--ink-2);line-height:1.5}
  .sys-line strong{color:var(--accent-ink)}
  .sys-x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;color:var(--ink-3);font-size:18px;width:30px;height:30px;display:grid;place-items:center}

  /* Level-up burst */
  #burst{position:fixed;inset:0;z-index:75;pointer-events:none;display:none;place-items:center}
  #burst.show{display:grid}
  #burst .ring{width:40px;height:40px;border-radius:50%;border:3px solid var(--accent);
    box-shadow:0 0 40px rgba(56,189,248,.8);animation:burst .9s ease-out forwards}
  @keyframes burst{0%{width:40px;height:40px;opacity:1}100%{width:520px;height:520px;opacity:0;border-width:1px}}
  #burst .txt{position:absolute;font-family:var(--mono);font-weight:800;font-size:22px;color:var(--accent);
    text-shadow:0 0 20px rgba(56,189,248,.8);letter-spacing:2px;animation:bursttxt .9s ease-out forwards}
  @keyframes bursttxt{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}

  /* Awakening intro */
  #awaken{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;padding:32px 26px;gap:18px}
  #awaken.show{display:flex}
  #awaken .a-icon{font-size:54px;animation:floaty 2.4s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(56,189,248,.7))}
  @keyframes floaty{50%{transform:translateY(-10px)}}
  #awaken .a-tag{font-family:var(--mono);font-size:11px;letter-spacing:4px;color:var(--accent);text-transform:uppercase}
  #awaken .a-h{font-family:var(--serif);font-size:24px;line-height:1.35;font-weight:600;max-width:30ch}
  #awaken .a-sub{font-size:14px;color:var(--ink-2);max-width:32ch;line-height:1.5}
  #awaken .a-inp{width:100%;max-width:280px;padding:13px;border-radius:10px;border:1.5px solid var(--accent);
    background:var(--surface);color:var(--ink);text-align:center;font-family:var(--mono);font-size:15px;
    box-shadow:0 0 16px rgba(56,189,248,.3)}
  #awaken .a-btn{width:100%;max-width:280px}

  /* Shadow army grid */
  .army-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
  .shadow{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line-glow);
    border-radius:12px;padding:12px 6px;text-align:center;box-shadow:var(--glow-sm)}
  .shadow .sg{font-size:24px;margin-bottom:4px;filter:drop-shadow(0 0 6px rgba(56,189,248,.4))}
  .shadow .sn{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent-ink);letter-spacing:.5px;line-height:1.2}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="overlay" id="overlay"></div>
<div class="flash" id="flash"></div>
<div id="sysnotify"></div>
<div id="burst"></div>
<div id="awaken"></div>

var KEY="neetss_v1";
var DEFAULT={examDate:"",srs:{},planner:{},history:[],lastDetails:null,

function today(){return new Date().toISOString().slice(0,10);}

function dayDiff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);}
function markActive(){var t=today();if(S.activeDays.indexOf(t)<0){S.activeDays.push(t);}}
function streak(){var days=S.activeDays.slice().sort();if(!days.length)return 0;var set={};days.forEach(function(d){set[d]=1;});var t=today();if(!set[t]&&!set[addDays(t,-1)])return 0;var start=set[t]?t:addDays(t,-1);var n=0,c=start;while(set[c]){n++;c=addDays(c,-1);}return n;}/* ---------- SEED CONTENT (high-yield, editable) ---------- */

/* ---------- SRS (SM-2) ---------- */
function srsOf(id){return S.srs[id]||{ease:2.5,interval:0,reps:0,due:today()};}
function dueCards(){var t=today();return allC().filter(function(c){var r=srsOf(c.id);return r.due<=t;});}
function gradeCard(id,q){ // q: 1 again,3 hard,4 good,5 easy
  var r=srsOf(id);
  if(q<3){r.reps=0;r.interval=0;r.due=today();}
  else{
    if(r.reps===0)r.interval=1;
    else if(r.reps===1)r.interval=6;
    else r.interval=Math.round(r.interval*r.ease);
    if(q===5)r.interval=Math.round(r.interval*1.15)||1;
    r.reps+=1;r.due=addDays(today(),r.interval);
  }
  r.ease=Math.max(1.3,r.ease+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  S.srs[id]=r;markActive();save();
}
function cardBucket(id){var r=S.srs[id];if(!r||r.reps===0)return "new";if(r.interval>=21)return "mastered";return "learning";}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var SHADOW_NAMES=["—","Igris","Iron","Tank","Tusk","Kaisel","Beru","Bellion"];
var TITLE_DEFS=[
  {id:"awaken",label:"The Awakened",test:function(){return S.game.awakened;}},
  {id:"diligent",label:"Diligent",test:function(){return S.game.daily.claimed;}},
  {id:"drank",label:"Gate-Crasher",test:function(){return S.game.gatesCleared>=1;}},
  {id:"raider",label:"Gate Raider",test:function(){return S.game.gatesCleared>=10;}},
  {id:"srank",label:"S-Rank Hunter",test:function(){return (S.history||[]).some(function(r){return pct(r.correct,r.total)>=90;});}},
  {id:"arise",label:"Necromancer",test:function(){return S.game.shadowCount>=1;}},
  {id:"commander",label:"Shadow Commander",test:function(){return S.game.shadowCount>=10;}},
  {id:"unbroken",label:"Unbroken",test:function(){return streak()>=7;}},
  {id:"monarch",label:"Shadow Monarch",test:function(){return S.game.level>=40;}}
];

function xpNeeded(level){return 80+level*30;}
function rankOf(level){
  for(var i=0;i<RANKS.length;i++){if(level<RANKS[i].max)return RANKS[i];}
  return RANKS[RANKS.length-1];
}
function gateRank(p){
  if(p>=90)return "S"; if(p>=80)return "A"; if(p>=70)return "B";
  if(p>=60)return "C"; if(p>=45)return "D"; return "E";
}
function rankCls(k){return "r-"+(k==="N"?"N":k);}

function dailyReset(){
  var g=S.game,t=today();
  if(g.daily.date!==t){g.daily={date:t,q:0,cards:0,gates:0,claimed:false};}
}
function dailyDone(){var d=S.game.daily;return d.q>=DAILY.q&&d.cards>=DAILY.cards&&d.gates>=DAILY.gates;}

function awardXP(n,reason){
  if(n<=0)return;
  var g=S.game; g.xp+=n; var ups=[];var guard=0;
  while(g.xp>=xpNeeded(g.level)&&guard++<1000){g.xp-=xpNeeded(g.level);g.level++;g.ap+=3;ups.push(g.level);}
  save();
  if(ups.length){levelBurst(ups[ups.length-1]);ping("level");
    notif("LEVEL UP","You have risen to Lv. "+ups[ups.length-1],
      ["Hunter rank: "+rankOf(g.level).label,
       "+3 ability points to allocate",
       reason?("Source: "+reason):"Keep clearing gates, Player."],4200);
  }
}

function hasTitle(id){return S.game.titles.indexOf(id)>=0;}
function grantTitle(id,label){if(!hasTitle(id)){S.game.titles.push(id);S.game.title=label;return true;}return false;}
function checkTitles(){
  var fresh=[];
  TITLE_DEFS.forEach(function(td){if(td.test()&&grantTitle(td.id,td.label))fresh.push(td.label);});
  if(fresh.length){save();ping("title");
    notif("TITLE ACQUIRED",'New title: "'+fresh[fresh.length-1]+'"',
      fresh.map(function(f){return "· "+f;}),4600);}
  return fresh;
}

function shadowNameFor(count){
  var name="Shadow Soldier";
  for(var i=SHADOW_MILES.length-1;i>=0;i--){if(count>=SHADOW_MILES[i]&&SHADOW_MILES[i]>0){name=SHADOW_NAMES[i];break;}}
  return name;
}
function arise(cardId){
  var g=S.game;
  if(g.shadowIds.indexOf(cardId)>=0)return null;
  var prev=g.shadowCount;
  g.shadowIds.push(cardId);g.shadowCount=g.shadowIds.length;save();
  var prevMile=shadowNameFor(prev),nowMile=shadowNameFor(g.shadowCount);
  ping("arise");
  if(nowMile!==prevMile&&nowMile!=="Shadow Soldier"){
    notif("ARISE",nowMile+" has answered your call",
      ["Shadow Army strength: "+g.shadowCount,
       "Mastered knowledge bends to your will, Monarch."],4800);
  }else{
    notif("ARISE","A new shadow rises",
      ["Shadow Army strength: "+g.shadowCount,
       "ARISE. — Another mastered card joins your ranks."],3600);
  }
  return nowMile;
}

/* ---------- sound (WebAudio) ---------- */
var actx=null;
function ping(kind){
  if(S.game.muted)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    var f={xp:880,level:[660,990,1320],arise:523,title:740,gate:988,click:620}[kind]||740;
    if(Array.isArray(f)){
      o.frequency.setValueAtTime(f[0],actx.currentTime);
      o.frequency.setValueAtTime(f[1],actx.currentTime+.08);
      o.frequency.setValueAtTime(f[2],actx.currentTime+.16);
    }else{o.frequency.value=f;}
    o.type="triangle";
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.12,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+ (Array.isArray(f)?.28:.22));
    o.start();o.stop(actx.currentTime+.3);
  }catch(e){}
}

/* ---------- System notification banner ---------- */
var notifyT=null;
function notif(tag,title,lines,duration){
  var el=document.getElementById("sysnotify");if(!el)return;
  var body=lines.map(function(l){return '<div class="sys-line">'+esc(l)+'</div>';}).join("");
  el.innerHTML='<div class="sys-tag">[ SYSTEM ] '+esc(tag)+'</div>'+
    '<div class="sys-title">'+esc(title)+'</div>'+body+
    '<button class="sys-x" data-act="dismissnote">✕</button>';
  el.classList.add("show");
  clearTimeout(notifyT);
  notifyT=setTimeout(function(){el.classList.remove("show");},duration||4000);
}

/* ---------- level-up burst ---------- */
function levelBurst(level){
  var b=document.getElementById("burst");if(!b)return;
  b.innerHTML='<div class="ring"></div><div class="txt">LV. '+level+'</div>';
  b.classList.add("show");
  setTimeout(function(){b.classList.remove("show");},950);
}

/* ---------- stat allocation ---------- */
function allocStat(stat){
  if(["STR","VIT","AGI","INT","PER"].indexOf(stat)<0)return;
  if(S.game.ap<=0){toast("No ability points");return;}
  S.game.stats[stat]=(S.game.stats[stat]||10)+1;S.game.ap--;save();ping("click");render();
}

  ping("level");levelBurst(1);
  grantTitle("awaken","The Awakened");save();

function renderTabs(){
  var due=dueCards().length;
  document.getElementById("tabbar").innerHTML=TABS.map(function(t){
    var badge=(t.id==="cards"&&due>0)?'<span class="badge">'+due+'</span>':'';
    return '<button class="tab'+(t.id===tab?" on":"")+'" data-tab="'+t.id+'">'+
      '<span style="position:relative"><svg viewBox="0 0 24 24">'+t.icon+'</svg>'+badge+'</span>'+t.label+'</button>';
  }).join("");

function finishTest(){
  if(!run)return;if(run.finished)return;run.finished=true;
  if(timerId){clearInterval(timerId);timerId=null;}
  var correct=0,wrong=0,unatt=0,perSub={};
  run.qs.forEach(function(q){
    perSub[q.s]=perSub[q.s]||{c:0,t:0};perSub[q.s].t++;
    var ch=run.ans[q.id];
    if(ch==null)unatt++;
    else if(ch===q.a){correct++;perSub[q.s].c++;}
    else wrong++;
  });
  var score=correct*4-wrong*1,maxScore=run.qs.length*4;
  var subs=testCfg.subs.map(function(s){return SUB_ABBR[s];});
  var subsLabel=subs.length===SUBJECTS.length?"All subjects":subs.join(", ");
  var rec={date:today(),total:run.qs.length,correct:correct,wrong:wrong,unatt:unatt,
    score:score,maxScore:maxScore,perSub:perSub,subsLabel:subsLabel,
    timeSec:Math.round((Date.now()-run.started)/1000)};
  S.history.push(rec);S.lastDetails={qs:run.qs.map(function(q){return {q:q,ch:run.ans[q.id]};})};
  markActive();save();
  drawScorecard(rec);
}

/* wrap finishTest so a completed gate feeds the System */
var _finishTestOrig=finishTest;
finishTest=function(){
  if(run&&run._sysScored)return;
  var answered=0;
  if(run){run.qs.forEach(function(q){if(run.ans[q.id]!=null)answered++;});run._sysScored=true;}
  _finishTestOrig.apply(this,arguments);
  var rec=S.history[S.history.length-1]; if(!rec)return;
  dailyReset();
  var p=pct(rec.correct,rec.total);
  S.game.daily.q+=answered;
  var gr=gateRank(p),cleared=p>=45;
  if(cleared){S.game.gatesCleared++;S.game.daily.gates++;}
  save();
  var xp=rec.correct*8+(cleared?60:0)+(gr==="S"?80:gr==="A"?40:gr==="B"?20:0);
  awardXP(xp,"gate · "+gr+"-rank clear");
  checkTitles();
  ping("gate");
  notif(cleared?"GATE CLEARED":"GATE COLLAPSED",
    cleared?("Clear-rank "+gr+" · "+p+"%"):"Rank E · "+p+"% — the gate held",
    [(cleared?("+"+xp+" XP · "+(gr==="S"?"flawless raid":gr==="A"?"superior":gr==="B"?"clean":"passed")):"No XP bonus — retreat and retry"),
     rec.correct+" correct · "+rec.wrong+" wrong · "+rec.unatt+" skipped"],5400);
};

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-tab],[data-act],[data-sub],[data-cnt],[data-bsub],[data-topic],[data-addtopic],[data-choose],[data-jump],[data-grade],[data-delc],[data-flip],[data-stat]");
  if(!el)return;
  var d=el.dataset;

  if(d.tab){go(d.tab);return;}

  /* config */
  if(d.sub!=null){var s=d.sub,ix=testCfg.subs.indexOf(s);if(ix>=0){if(testCfg.subs.length>1)testCfg.subs.splice(ix,1);}else testCfg.subs.push(s);render();return;}
  if(d.cnt){testCfg.count=+d.cnt;render();return;}
  if(d.bsub){browseSub=d.bsub;render();return;}
  if(d.stat){allocStat(d.stat);return;}

  /* planner */
  if(d.topic){S.planner[d.topic]=!S.planner[d.topic];markActive();save();render();return;}
  if(d.addtopic){var inp=document.getElementById("extra-"+SUB_ABBR[d.addtopic]);var v=(inp&&inp.value||"").trim();
    if(v){S.planner["_extra_"+d.addtopic]=(S.planner["_extra_"+d.addtopic]||[]);S.planner["_extra_"+d.addtopic].push(v);save();render();}return;}

  /* runner interactions */
  if(d.choose!=null&&run){run.ans[run.qs[run.i].id]=+d.choose;drawRunner();return;}
  if(d.jump!=null&&run){run.i=Math.max(0,Math.min(+d.jump,run.qs.length-1));drawRunner();return;}
  if(d.grade!=null&&rev){
    var card=rev.cards[rev.i],grade=+d.grade;
    if(!card){return;} /* review already complete (i out of range) — ignore stray grade */
    var prevInt=srsOf(card.id).interval;
    gradeCard(card.id,grade);
    dailyReset();S.game.daily.cards=(S.game.daily.cards||0)+1;
    if(grade>=4)awardXP(5,"card review");
    if(grade>=3&&prevInt<21&&srsOf(card.id).interval>=21){arise(card.id);checkTitles();}
    save();
    rev.done++;rev.i++;rev.show=false;drawCard();return;
  }
  if(d.delc){S.customC=S.customC.filter(function(c){return c.id!==d.delc;});save();render();toast("Card deleted");return;}

  var a=d.act;
  switch(a){
    case "dismissnote":document.getElementById("sysnotify").classList.remove("show");clearTimeout(notifyT);break;
    case "mute":S.game.muted=!S.game.muted;save();render();toast(S.game.muted?"Sound off":"Sound on");break;
    case "claimdaily":
      if(dailyDone()&&!S.game.daily.claimed){S.game.daily.claimed=true;save();awardXP(100,"daily quest");checkTitles();ping("title");
        notif("DAILY QUEST COMPLETE","Reward claimed · +100 XP",
          ["The System acknowledges your diligence, Player.","Return tomorrow for a new quest."],4600);render();}
      break;
    case "awaken-confirm":confirmAwaken();break;
    case "goplan":go("plan");break;
    case "gocards":go("cards");break;
    case "gotests":go("tests");break;
    case "gostats":go("stats");break;
    case "quick":testCfg.subs=SUBJECTS.slice();testCfg.count=10;testCfg.timed=true;startTest();break;
    case "toggletime":testCfg.timed=!testCfg.timed;render();break;
    case "starttest":startTest();break;
    case "next":if(!run)return;run.i=Math.min(run.i+1,run.qs.length-1);drawRunner();break;
    case "prev":if(!run)return;run.i=Math.max(run.i-1,0);drawRunner();break;
    case "markq":if(!run)return;run.mark[run.qs[run.i].id]=!run.mark[run.qs[run.i].id];drawRunner();break;
    case "showpal":showPalette();break;
    case "closepal":drawRunner();break;
    case "submit":if(confirm("Submit the raid now?"))finishTest();break;
    case "quit":if(confirm("Retreat from this gate without saving?"))closeRun();break;
    case "reviewtest":drawReview();break;
    case "backscore":drawScorecard(S.history[S.history.length-1]);break;
    case "closerun":closeRun();break;
    case "review":startReview();break;
    case "flip":rev.show=true;drawCard();break;
    case "closecard":closeCard();break;
    case "addcard":addCard();break;
    case "savedate":var di=document.getElementById("exam-date");if(di&&di.value){S.examDate=di.value;save();toast("Final gate date saved");render();}break;
    case "addq":addQuestion();break;
    case "export":exportData();break;
    case "import":importData();break;
    case "reset":if(confirm("Erase ALL progress, shadows, titles and history on this device?")){localStorage.removeItem(KEY);S=load();toast("World reset");go("home");if(!S.game.awakened)awakening();}break;
  }
});

/* ---------- boot ---------- */
dailyReset();
if(!S.game.awakened){awakening();}
render();
})();
</script>
