<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="NEET SS System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="#38bdf8" opacity="0.13"/>
  <rect x="92" y="92" width="328" height="328" rx="30" fill="none" stroke="#38bdf8" stroke-width="12" filter="url(#glow)"/>
  <text x="256" y="256" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="196" font-weight="700"
        fill="#38bdf8" text-anchor="middle" dominant-baseline="central" filter="url(#glow)">SS</text>
</svg>
